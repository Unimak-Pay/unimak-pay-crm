openapi: 3.1.0
info:
  title: UNIMAK Pay API
  version: 1.0.0
  summary: University of Makeni fee collection backend (Monime).
  description: |
    Fee lookup and payment for applicants and students, over USSD (Monime USSD flow)
    and Dash Dots (channel API), plus the admin API behind the dashboard.

    **Money** is always a string of SLE minor units (1 SLE = 100): `"150000"` = SLE 1,500.00.
    Channel responses wrap it as `{ value, display }`.

    **Errors.** Business errors:
    `{ "error": { "code": "OBLIGATION_SETTLED", "message": "...", "details": {} } }`.
    Validation and routing errors use the framework shape
    `{ "statusCode": 400, "message": ["amount must be ..."], "error": "Bad Request" }`.

    | code | HTTP |
    |---|---|
    | `NOT_FOUND`, `PAYER_NOT_FOUND` | 404 |
    | `VALIDATION` | 400 |
    | `UNAUTHENTICATED` | 401 |
    | `FORBIDDEN`, `MFA_REQUIRED` | 403 |
    | `AMBIGUOUS_RATE_RULE`, `OBLIGATION_SETTLED`, `FEE_NOT_ACTIVE`, `IDEMPOTENCY_CONFLICT`, `INVALID_STATE` | 409 |
    | `NO_RATE_RULE`, `AMOUNT_BELOW_MIN_INSTALMENT`, `AMOUNT_EXCEEDS_PAYABLE`, `INSTALMENTS_NOT_ALLOWED` | 422 |
    | `RATE_LIMITED` | 429 |
    | `UPSTREAM_UNAVAILABLE` | 503 |

    Keep this file in sync with the controllers: `test/e2e/openapi.e2e-spec.ts` fails when a
    route exists in the app but not here (or the other way round).
servers:
  - url: https://unimak-pay-backend.vercel.app
    description: Production
  - url: http://localhost:3100
    description: Local

security:
  - channelHmac: []

tags:
  - name: Channel
    description: Server-to-server payment channels. HMAC-signed (`channelHmac`).
  - name: Dash dot
    description: |
      Public API for the UNIMAK dot in Monime Dash. A dot's code is public, so there is no secret:
      requests are limited per IP (`DOT_RATE_LIMIT_PER_MINUTE`, 429 `RATE_LIMITED` with `Retry-After`),
      the lookup shows the full name but a masked phone (status lookups stay masked), and amounts and the receiving account are decided by the server.
      From dot 0.2.3, `X-User-Alias` (the Dash account's phone) must match the payer's phone for private
      details (full lookup, history, pay requests, clearance): 403 `ALIAS_MISMATCH` / `ALIAS_REQUIRED`.
      It's a check, not a login. Sponsors (another number) get a short lookup and can still quote and pay.
      The dot pays with `dash.payments.request({ order, financialAccountId })` using what
      `POST /v1/dot/payments` returns; Monime's `payment.processing_completed` webhook (matched on
      `reference` = our payment id) is the only thing that marks it paid.
  - name: Admin · Reports
    description: Collection totals for the dashboard.
  - name: Admin · Payers
    description: Who owes what, by department and level, down to one student (docs/analytics.md).
  - name: Admin · Payments
  - name: Admin · Fee setup
    description: Fee types (each with its own Monime financial account), fees and their rules.
  - name: Admin · Treasury
    description: Financial accounts, commission transfers, bank payouts.
  - name: Admin · Reconciliation
  - name: Admin · Users & audit
  - name: Admin · Faculties & departments
    description: |
      Faculties → departments. Department codes are what the portal sends for a payer and what fee rules,
      minimum instalments and heads of department use, so codes never change; nothing is deleted (deactivate).
      A department the portal sends that isn't listed is added with `needsReview: true` (payments never wait for it).
  - name: Portal
    description: |
      Called by the university portal: student and applicant changes as signed batches of events,
      and a count check. Contract and rules: docs/portal-events.md.
  - name: Admin · Portal sync
    description: What the portal sent, and students who are no longer active but still owe something.
  - name: Monime
    description: Called by Monime (webhook, USSD flow exchange).
  - name: Public
  - name: Cron
  - name: Dev
    description: Only when `NODE_ENV` is not `production`.

paths:
  # ── Public ──────────────────────────────────────────────────────────────────
  /health:
    get:
      operationId: health
      tags: [Public]
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { const: true } } }

  /r/{verifyCode}:
    get:
      operationId: publicVerify
      tags: [Public]
      summary: Receipt verification page
      description: Minimal HTML (masked name, amount, fee, date). `noindex`, `Cache-Control no-store`.
      security: []
      parameters:
        - { name: verifyCode, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Valid receipt, content: { text/html: { schema: { type: string } } } }
        '404': { description: Unknown code, content: { text/html: { schema: { type: string } } } }

  /c/{code}:
    get:
      operationId: publicExamPass
      tags: [Public]
      summary: Exam pass check (what an invigilator's scanner opens)
      description: |
        Re-checks clearance **now** against the current rule, every time, so a screenshot of an
        old pass proves nothing: "✓ Cleared" or "✗ Not cleared", with the student's full name, ID,
        programme and the time checked. No phone, no amounts. `noindex`, `Cache-Control no-store`;
        rate-limited per IP like the dot API.
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: 7KQ2MX9P }, description: The pass code }
      responses:
        '200': { description: The live check (cleared or not), content: { text/html: { schema: { type: string } } } }
        '404': { description: Unknown code, content: { text/html: { schema: { type: string } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ── Channel API ─────────────────────────────────────────────────────────────
  /v1/channel/payers/{kind}/{ref}:
    get:
      operationId: channelGetPayer
      tags: [Channel]
      summary: Look up a payer
      description: Fetches from the university portal (cached) and creates any missing obligations.
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }]
      responses:
        '200': { description: Payer, content: { application/json: { schema: { $ref: '#/components/schemas/Payer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channel/payers/{kind}/{ref}/obligations:
    get:
      operationId: channelGetObligations
      tags: [Channel]
      summary: What the payer owes
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }]
      responses:
        '200':
          description: Payer and obligations
          content:
            application/json:
              schema:
                type: object
                required: [payer, obligations]
                properties:
                  payer: { $ref: '#/components/schemas/Payer' }
                  obligations: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channel/payers/{kind}/{ref}/receipts:
    get:
      operationId: channelGetReceipts
      tags: [Channel]
      summary: Receipts of a payer
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }]
      responses:
        '200':
          description: Receipts, newest first
          content:
            application/json:
              schema:
                type: object
                properties: { receipts: { type: array, items: { $ref: '#/components/schemas/Receipt' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channel/quotes:
    post:
      operationId: channelPostQuote
      tags: [Channel]
      summary: Validate an amount without creating anything
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationId, amount, channel]
              properties:
                obligationId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/MinorAmount' }
                channel: { $ref: '#/components/schemas/Channel' }
      responses:
        '200':
          description: Valid amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount: { $ref: '#/components/schemas/MinorAmount' }
                  payable: { $ref: '#/components/schemas/MinorAmount' }
                  minInstalment: { $ref: '#/components/schemas/MinorAmount' }
                  payerPays: { description: 'Always equal to amount: the payer never pays extra.', $ref: '#/components/schemas/MinorAmount' }
                  valid: { const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /v1/channel/payments:
    post:
      operationId: channelPostPayment
      tags: [Channel]
      summary: Start a payment
      description: |
        Creates a PENDING payment (awaiting payment: it never expires and holds nothing; deleted after 7 days if
        unpaid, see docs/payment-lifecycle.md) and a Monime payment code. `expiresAt` = when it is deleted if unpaid.
        The payer approves by dialling `ussdCode`. Idempotent per client on `idempotencyKey`:
        repeating the call returns the same payment (and retries Monime if it never got through).
        Give the payer `paymentRef` to check the status later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obligationId, amount, payerPhone, channel, idempotencyKey]
              properties:
                obligationId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/MinorAmount' }
                payerPhone: { type: string, pattern: '^\+?\d{8,15}$', example: '+23276123456', description: 'The payment code is restricted to this number.' }
                channel: { $ref: '#/components/schemas/Channel' }
                idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
      responses:
        '201':
          description: Payment started
          content:
            application/json:
              schema:
                type: object
                required: [paymentId, paymentRef, status, expiresAt]
                properties:
                  paymentId: { type: string, format: uuid }
                  paymentRef: { $ref: '#/components/schemas/PaymentRef' }
                  status: { $ref: '#/components/schemas/PaymentStatus' }
                  expiresAt: { type: string, format: date-time }
                  ussdCode: { type: [string, 'null'], example: '*715*1*7344331308#' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Upstream' }

  /v1/channel/payments/status/{ref}:
    get:
      operationId: channelGetPaymentStatus
      tags: [Channel]
      summary: Payment status by what the payer holds
      description: |
        `ref` is our 8-digit payment ref or Monime's order number (from Monime's SMS).
        Case, spaces and dashes are ignored. Works for payments from any channel; payer
        details are masked.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string, examples: ['15540719', '3BMRXXXQXJW3'] } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatusView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channel/payments/{id}:
    get:
      operationId: channelGetPayment
      tags: [Channel]
      summary: A payment created by the calling client
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelPayment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Dash dot (public) ───────────────────────────────────────────────────────
  /v1/dot/payers/{kind}/{ref}:
    get:
      operationId: dotGetPayer
      tags: [Dash dot]
      summary: Look up a payer and what they owe
      description: |
        Reads our store first (the portal for someone new) and creates any missing obligations.
        - `X-User-Alias` matches the payer's phone, or is missing (dots before 0.2.3, while
          `DOT_ALIAS_REQUIRED` is off): the full name and academic details (`DotPayer`), phone masked.
        - Another number (a sponsor paying for someone): only what's needed to pay (`DotPayerShort`:
          first name and last initial, `limited: true`) with the same obligations. After too many
          wrong numbers from one IP or for one ID, it answers short without checking.
      security: []
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }, { $ref: '#/components/parameters/UserAlias' }]
      responses:
        '200':
          description: Payer and obligations
          content:
            application/json:
              schema:
                type: object
                required: [payer, obligations]
                properties:
                  payer: { oneOf: [{ $ref: '#/components/schemas/DotPayer' }, { $ref: '#/components/schemas/DotPayerShort' }] }
                  obligations: { type: array, items: { $ref: '#/components/schemas/Obligation' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/quotes:
    post:
      operationId: dotPostQuote
      tags: [Dash dot]
      summary: Validate an amount without creating anything
      description: Works for anyone (sponsors too); `X-User-Alias` isn't checked.
      security: []
      parameters: [{ $ref: '#/components/parameters/UserAlias' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DotAmountRequest' }
      responses:
        '200':
          description: Valid amount
          content:
            application/json:
              schema:
                type: object
                required: [amount, payable, minInstalment, valid]
                properties:
                  amount: { $ref: '#/components/schemas/MinorAmount' }
                  payable: { $ref: '#/components/schemas/MinorAmount' }
                  minInstalment: { $ref: '#/components/schemas/MinorAmount' }
                  valid: { const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/payments:
    post:
      operationId: dotPostPayment
      tags: [Dash dot]
      summary: Start a payment and get the order for Dash's payment sheet
      description: |
        Records a PENDING payment (never expires, holds nothing; `expiresAt` = when it is deleted if still unpaid)
        and returns `order` and `financialAccountId`
        to pass unchanged to `dash.payments.request()`. No Monime call is made here.
        Idempotent on the `Idempotency-Key` header: a retry returns the same payment and order
        (409 `IDEMPOTENCY_CONFLICT` if the key was used for a different obligation or amount).
        Show the payer `paymentRef` for later status checks. Works for anyone (sponsors too);
        `X-User-Alias` isn't checked.

        Optional (dot 0.2.3+): `payRequestCode` pays through a pay request (it must be open, not
        expired and for this obligation: 404 / 400 / 409 `INVALID_STATE`; a retry with the same key
        replays even after the request closed). The payment counts towards the request only once
        Monime completes it. `paidByName` (first name, display only) and `payingForSelf` feed
        `paidBy` in history and receipts.
      security: []
      parameters:
        - { $ref: '#/components/parameters/UserAlias' }
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random key per payment (e.g. `dash.crypto.randomUUID()`), reused on retries.
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,100}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DotPaymentRequest' }
      responses:
        '201':
          description: Payment started
          content:
            application/json:
              schema:
                type: object
                required: [paymentId, paymentRef, status, amount, expiresAt, order, financialAccountId]
                properties:
                  paymentId: { type: string, format: uuid }
                  paymentRef: { $ref: '#/components/schemas/PaymentRef' }
                  status: { $ref: '#/components/schemas/PaymentStatus' }
                  amount: { $ref: '#/components/schemas/Money' }
                  expiresAt: { type: string, format: date-time }
                  order: { $ref: '#/components/schemas/DashOrder' }
                  financialAccountId: { type: string, description: 'Monime financial account of the fee type; pass to dash.payments.request().' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/payments/status/{ref}:
    get:
      operationId: dotGetPaymentStatus
      tags: [Dash dot]
      summary: Payment status by what the payer holds
      description: '`ref` is our 8-digit payment ref or Monime''s order number. Payer details are masked.'
      security: []
      parameters:
        - { $ref: '#/components/parameters/UserAlias' }
        - { name: ref, in: path, required: true, schema: { type: string, examples: ['15540719', '3BMRXXXQXJW3'] } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentStatusView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/payers/{kind}/{ref}/payments:
    get:
      operationId: dotPaymentHistory
      tags: [Dash dot]
      summary: Payment history
      description: |
        Every payment towards the payer's fees from any channel, newest first: all COMPLETED ones,
        those still open, and FAILED / EXPIRED ones from the last 30 days. `X-User-Alias` must match.
        `academicYear` is the latest `YYYY/YY` period of the payer's obligations (else their latest
        period; null with none); `totalPaid` = COMPLETED payments on obligations in that period.
        Only Monime's confirmation makes a payment COMPLETED.
      security: []
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }, { $ref: '#/components/parameters/UserAlias' }]
      responses:
        '200': { description: History, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentHistory' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AliasForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/payments/{paymentRef}/receipt:
    get:
      operationId: dotGetReceipt
      tags: [Dash dot]
      summary: Receipt of a completed payment
      description: |
        By our 8-digit `paymentRef` (random), so the result page can open it right after paying.
        404 until Monime completed the payment. `verifyUrl` is the public `/r/{verifyCode}` page
        (show it as a QR code). `pdfUrl` is null for now.
      security: []
      parameters:
        - { name: paymentRef, in: path, required: true, schema: { $ref: '#/components/schemas/PaymentRef' } }
        - $ref: '#/components/parameters/UserAlias'
      responses:
        '200': { description: Receipt, content: { application/json: { schema: { $ref: '#/components/schemas/DotReceipt' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/payers/{kind}/{ref}/clearance:
    get:
      operationId: dotGetClearance
      tags: [Dash dot]
      summary: Exam clearance
      description: |
        Students only (applicants: 404). `X-User-Alias` must match. Evaluated live from the ledger
        and the finance office's rule (`GET /v1/admin/clearance-policy`): NOT_CLEARED lists the
        `blocking` fees and what's `outstanding` (money held by an open payment isn't paid yet).
        CLEARED carries a pass: `passCode` and `verifyUrl` (`/c/{passCode}`, which re-checks live).
        The pass code stays the same for the student and period.
      security: []
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }, { $ref: '#/components/parameters/UserAlias' }]
      responses:
        '200': { description: Clearance, content: { application/json: { schema: { $ref: '#/components/schemas/Clearance' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AliasForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/pay-requests:
    post:
      operationId: dotCreatePayRequest
      tags: [Dash dot]
      summary: Ask someone to pay (create a pay request)
      description: |
        `X-User-Alias` must match the student's phone (403 `ALIAS_REQUIRED` / `ALIAS_MISMATCH`).
        Idempotent on `Idempotency-Key` like payments (same key, different body: 409
        `IDEMPOTENCY_CONFLICT`). `amount` above the fee's payable: 422 `AMOUNT_EXCEEDS_PAYABLE`; a
        paid fee: 409 `OBLIGATION_SETTLED`; at most 20 open requests per payer (400 `VALIDATION`).
        Expires after 30 days, or on the fee's due date if sooner, never less than 3 days.
      security: []
      parameters:
        - $ref: '#/components/parameters/UserAlias'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,100}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, ref, obligationId, message]
              properties:
                kind: { type: string, enum: [student, applicant] }
                ref: { type: string }
                obligationId: { type: string, format: uuid }
                amount: { oneOf: [{ $ref: '#/components/schemas/MinorAmount' }, { type: 'null' }], description: 'null = "whatever you can"' }
                message: { type: string, minLength: 1, maxLength: 280, description: 'Trimmed; 1-280 characters after trimming.' }
                recipientName: { type: [string, 'null'], maxLength: 60 }
      responses:
        '201': { description: The request (or the existing one on a retry), content: { application/json: { schema: { $ref: '#/components/schemas/PayRequest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AliasForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/pay-requests/{code}:
    get:
      operationId: dotGetPayRequest
      tags: [Dash dot]
      summary: A pay request, for the sponsor's page
      description: |
        No alias match needed: the code is the secret. The first call records `openedAt`.
        `requester` is only a first name and programme.
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, example: K7PQ2XA } }
        - $ref: '#/components/parameters/UserAlias'
      responses:
        '200': { description: The request, content: { application/json: { schema: { $ref: '#/components/schemas/PayRequest' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/dot/payers/{kind}/{ref}/pay-requests:
    get:
      operationId: dotListPayRequests
      tags: [Dash dot]
      summary: A payer's pay requests, newest first
      description: '`X-User-Alias` must match the payer''s phone.'
      security: []
      parameters: [{ $ref: '#/components/parameters/PayerKind' }, { $ref: '#/components/parameters/PayerRef' }, { $ref: '#/components/parameters/UserAlias' }]
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/PayRequest' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AliasForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ── Monime ──────────────────────────────────────────────────────────────────
  /webhooks/monime:
    post:
      operationId: webhookReceive
      tags: [Monime]
      summary: Monime webhook
      description: |
        Signed with `Monime-Signature: t=<unix>,v1=<base64 HMAC-SHA256(secret, "<t>_" + raw body)>`.
        Events: `payment.processing_started` (→ PROCESSING), `payment.processing_completed`, `internal_transfer.completed|failed`,
        `payout.completed|failed`, `financial_account.credited|debited`. Deduplicated on
        `event.id`; business mismatches are acknowledged (200) and queued for reconciliation.
      security: [{ monimeSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                apiVersion: { type: string, example: caph.2025-08-23 }
                event: { type: object, properties: { id: { type: string }, name: { type: string }, timestamp: { type: string } } }
                object: { type: object, properties: { id: { type: string }, type: { type: string } } }
                data: { type: object, description: 'The Monime object (Payment, InternalTransfer, Payout, account movement).' }
      responses:
        '200': { description: Acknowledged, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookAck' } } } }
        '400': { description: Malformed payload }
        '401': { description: Missing or bad signature }

  # ── Portal ──────────────────────────────────────────────────────────────────
  /v1/portal/events:
    post:
      operationId: portalPostEvents
      tags: [Portal]
      summary: Student and applicant changes (batch of 1-500 events)
      description: |
        Each event carries the full current record (`applicant.upserted` or `student.upserted`).
        Per event: `APPLIED` (stored; missing obligations created), `DUPLICATE` (id seen before),
        `STALE` (we hold a version with the same or newer `updatedAt`) or `REJECTED` (invalid record:
        fix it and send with a new id). Retrying a batch with the same ids is always safe.
        Body up to 1 MB. Students who aren't ACTIVE get no new charges.
      security: [{ portalSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/PortalEventIn' } }
      responses:
        '200':
          description: A result per event, in the order sent
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, result]
                      properties:
                        id: { type: string }
                        result: { type: string, enum: [APPLIED, DUPLICATE, STALE, REJECTED] }
                        error: { type: object, properties: { code: { const: VALIDATION }, message: { type: string } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Body over 1 MB }
        '503': { description: PORTAL_EVENTS_SECRET is not configured }

  /v1/portal/summary:
    get:
      operationId: portalGetSummary
      tags: [Portal]
      summary: Our counts, for the portal to compare with its own
      security: [{ portalSignature: [] }]
      responses:
        '200':
          description: Counts by department (and level / status)
          content:
            application/json:
              schema:
                type: object
                required: [asOf, applicants, students, lastEventAt]
                properties:
                  asOf: { type: string, format: date-time }
                  applicants: { type: array, items: { type: object, properties: { department: { type: [string, 'null'] }, status: { type: [string, 'null'] }, count: { type: integer } } } }
                  students: { type: array, items: { type: object, properties: { department: { type: [string, 'null'] }, level: { type: [integer, 'null'] }, enrolmentStatus: { type: [string, 'null'] }, count: { type: integer } } } }
                  lastEventAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: PORTAL_EVENTS_SECRET is not configured }

  /v1/ussd/exchange/{token}:
    get:
      operationId: ussdHealth
      tags: [Monime]
      summary: USSD exchange health
      parameters: [{ $ref: '#/components/parameters/UssdToken' }]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ok }, encryption: { type: string }, keys: { type: integer } } }
        '404': { description: Wrong token }
    post:
      operationId: ussdExchange
      tags: [Monime]
      summary: USSD flow exchange (Monime → us)
      description: |
        Called by the UNIMAK USSD flow on every `on_done: exchange` page. Encrypted per
        Monime's USSD flow security: AES-128-GCM payload, key wrapped with our RSA public key
        (RSA-OAEP-SHA256). The reply is `text/plain` base64, encrypted with the same AES key.
        Decrypted request: `{ global: { sessionId, subscriberId, ... }, currentPage, flowData }`.
        Decrypted reply: `{ action: "navigate", pageId, pageData }` or `{ action: "stop", message }`.
        Requests are unsigned: the secret path token, server-side session state and rate
        limits protect it.
      parameters: [{ $ref: '#/components/parameters/UssdToken' }]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'Monime encrypted envelope (opaque).' }
      responses:
        '200': { description: Encrypted reply, content: { text/plain: { schema: { type: string, contentEncoding: base64 } } } }
        '400': { description: Cannot decrypt }
        '404': { description: Wrong token }

  # ── Cron ────────────────────────────────────────────────────────────────────
  /cron/outbox:
    get:
      operationId: cronOutbox
      tags: [Cron]
      summary: Dispatch due outbox messages
      security: [{ cronSecret: [] }]
      responses:
        '200':
          description: Sweep result
          content:
            application/json:
              schema: { type: object, properties: { claimed: { type: integer }, sent: { type: integer }, retried: { type: integer }, dead: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cron/expire-payments:
    get:
      operationId: cronExpirePayments
      tags: [Cron]
      summary: Payment housekeeping; delete USSD sessions older than 24 h
      description: |
        Payments don't expire. PROCESSING with no completion for 24 h goes back to PENDING; payments still
        awaiting payment after PENDING_PAYMENT_RETENTION_DAYS are deleted (audited). Also runs nightly.
      security: [{ cronSecret: [] }]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { type: object, properties: { processingReset: { type: integer }, pendingDeleted: { type: integer }, ussdSessionsDeleted: { type: integer }, portalEventsDeleted: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cron/reconcile:
    get:
      operationId: cronReconcile
      tags: [Cron]
      summary: Nightly reconciliation of yesterday (UTC), then expiry and outbox sweeps
      security: [{ cronSecret: [] }]
      responses:
        '200':
          description: 'Run (or `{ skipped: true, runId }` if yesterday is already done), plus housekeeping'
          content:
            application/json:
              schema:
                type: object
                properties:
                  skipped: { type: boolean }
                  runId: { type: string, format: uuid }
                  housekeeping: { type: object, properties: { processingReset: { type: integer }, pendingDeleted: { type: integer }, ussdSessionsDeleted: { type: integer }, portalEventsDeleted: { type: integer } } }
                  outbox: { type: object, additionalProperties: { type: integer } }
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Admin · users & audit ───────────────────────────────────────────────────
  /v1/admin/me:
    get:
      operationId: adminMe
      tags: [Admin · Users & audit]
      summary: The signed-in admin and their effective permissions
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Admin principal, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPrincipal' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/users:
    get:
      operationId: adminListUsers
      tags: [Admin · Users & audit]
      summary: List admin users
      x-permission: users.manage
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Admin users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateUser
      tags: [Admin · Users & audit]
      summary: Invite an admin (Supabase emails them; they bind on first sign-in)
      description: |
        Creates the admin, then asks Supabase Auth to email an invite link (needs `SUPABASE_SERVICE_ROLE_KEY`;
        the link opens `ADMIN_INVITE_REDIRECT_URL`, or the Supabase Site URL, where they set a password).
        The admin is created even if the email fails: check `invitation.status` and re-send with
        `POST /v1/admin/users/{id}/invite`. You cannot grant a role or permission you don't have yourself.
      x-permission: users.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                name: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/AdminRole' }
                extraPermissions: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/Permission' } }
                departments: { type: array, maxItems: 30, items: { type: string, maxLength: 50 }, description: 'HEAD_OF_DEPARTMENT (required): active, reviewed Department codes. Ignored for other roles.' }
                faculties: { type: array, maxItems: 30, items: { type: string, maxLength: 50 }, description: 'DEAN (required): active Faculty codes. Ignored for other roles.' }
      responses:
        '201': { description: Invited, content: { application/json: { schema: { $ref: '#/components/schemas/InvitedAdminUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/users/{id}/invite:
    post:
      operationId: adminResendInvite
      tags: [Admin · Users & audit]
      summary: Re-send the Supabase invite email
      description: Only for an active admin who hasn't signed in yet (409 otherwise). Audited as `admin_user.invite`.
      x-permission: users.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Invitation outcome, content: { application/json: { schema: { $ref: '#/components/schemas/InvitedAdminUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/users/{id}:
    get:
      tags: [Admin · Users & audit]
      operationId: adminGetUser
      summary: An admin user
      x-permission: users.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Admin user, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminUpdateUser
      tags: [Admin · Users & audit]
      summary: Update an admin (role, permissions, departments, deactivate)
      description: You cannot deactivate yourself, and there is always at least one active super admin.
      x-permission: users.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/AdminRole' }
                extraPermissions: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/Permission' } }
                departments: { type: array, maxItems: 30, items: { type: string, maxLength: 50 }, description: Checked like on create. }
                faculties: { type: array, maxItems: 30, items: { type: string, maxLength: 50 }, description: Checked like on create. }
                active: { type: boolean }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUser' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/portal-events:
    get:
      operationId: adminPortalEvents
      tags: [Admin · Portal sync]
      summary: Events the portal sent, newest first
      description: Kept 90 days. `lastAppliedAt` is when the last event was applied (sync health).
      x-permission: portal.read
      security: [{ adminJwt: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: 'Last event id of the previous page', schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [applicant.upserted, student.upserted] } }
        - { name: result, in: query, schema: { type: string, enum: [APPLIED, STALE, REJECTED] } }
        - { name: ref, in: query, description: 'studentId or applicationRef', schema: { type: string } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, lastAppliedAt]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PortalEvent' } }
                  nextCursor: { type: [string, 'null'] }
                  lastAppliedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/payers/needs-review:
    get:
      operationId: adminPayersNeedsReview
      tags: [Admin · Portal sync]
      summary: Students no longer active who still owe something
      description: |
        Suspended, withdrawn or graduated students (per the portal) with open obligations. They get no
        new charges; what they owe stays payable until a person decides. Heads of department and deans
        see their departments only.
      x-permission: payers.read
      security: [{ adminJwt: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, format: uuid } }
        - { name: department, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [SUSPENDED, WITHDRAWN, GRADUATED] } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/NeedsReviewPayer' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/reports/outstanding:
    get:
      operationId: adminReportsOutstanding
      tags: [Admin · Reports]
      summary: Billed, collected and outstanding by department × level
      description: |
        Live from obligations and the ledger (docs/analytics.md). **billed** = charges + adjustments,
        **collected** = payments net of refunds, **outstanding** = each obligation's positive balance.
        A student is paid (nothing outstanding), part-paid or unpaid; **overdue** = outstanding on a fee
        whose `dueDate` has passed.
        - **grid** / **totals**: students with at least one obligation of the selected fees. Suspended,
          withdrawn and graduated students are left out unless `includeInactive=true` (they're in Needs review).
        - **byFee**: the same students, per fee. **applicants**: applicants by status (no level filter).
        - **roster**: every active student in scope, and how many have no obligation at all (usually a
          missing rate rule), whatever the fee filter.
        - Heads of department and deans only see their departments (`filters.departments`).
      x-permission: reports.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/AnalyticsFeeId'
        - $ref: '#/components/parameters/AnalyticsFeeType'
        - $ref: '#/components/parameters/AnalyticsPeriod'
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/FacultyFilter'
        - $ref: '#/components/parameters/AnalyticsLevel'
        - $ref: '#/components/parameters/AnalyticsIncludeInactive'
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/OutstandingReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/payers:
    get:
      operationId: adminListPayers
      tags: [Admin · Payers]
      summary: Students and applicants with what they've been billed, paid and still owe
      description: |
        The list behind each cell of the outstanding report: pass the same filters plus `department`
        and `level`. Without a fee filter every payer is listed, including those with nothing billed
        (`standing: NOT_BILLED`); with one, only payers billed for it. `balance` = outstanding. Phones
        are masked. Cursor paging: pass `nextCursor` back with the same `sort`. Heads of department and
        deans only see their departments.
      x-permission: payers.read
      security: [{ adminJwt: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 400 }, description: '`nextCursor` from the previous page (same sort).' }
        - $ref: '#/components/parameters/AnalyticsSort'
        - $ref: '#/components/parameters/AnalyticsKind'
        - $ref: '#/components/parameters/AnalyticsStanding'
        - $ref: '#/components/parameters/AnalyticsEnrolmentStatus'
        - $ref: '#/components/parameters/AnalyticsSearch'
        - $ref: '#/components/parameters/AnalyticsFeeId'
        - $ref: '#/components/parameters/AnalyticsFeeType'
        - $ref: '#/components/parameters/AnalyticsPeriod'
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/FacultyFilter'
        - $ref: '#/components/parameters/AnalyticsLevel'
        - $ref: '#/components/parameters/AnalyticsIncludeInactive'
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PayerListItem' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/payers/export.csv:
    get:
      operationId: adminExportPayers
      tags: [Admin · Payers]
      summary: Download the payer list as CSV
      description: |
        Same filters and order as the list. Amounts in SLE (`1500.00`), phones masked. At most 50,000
        rows (400 `VALIDATION` beyond that). Cells starting with `= + - @` are prefixed with `'`.
        UTF-8 with BOM. Every export is audited (`payers.export`). Needs `payers.read` and `payments.export`.

        Columns: kind, ref, full_name, phone_masked, email_masked, program, department, department_name, faculty, level,
        enrolment_status, applicant_status, obligations, billed_sle, collected_sle, balance_sle, standing,
        overdue, overdue_sle, last_payment_at, payer_id.
      x-permission: payments.export
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/AnalyticsSort'
        - $ref: '#/components/parameters/AnalyticsKind'
        - $ref: '#/components/parameters/AnalyticsStanding'
        - $ref: '#/components/parameters/AnalyticsEnrolmentStatus'
        - $ref: '#/components/parameters/AnalyticsSearch'
        - $ref: '#/components/parameters/AnalyticsFeeId'
        - $ref: '#/components/parameters/AnalyticsFeeType'
        - $ref: '#/components/parameters/AnalyticsPeriod'
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/FacultyFilter'
        - $ref: '#/components/parameters/AnalyticsLevel'
        - $ref: '#/components/parameters/AnalyticsIncludeInactive'
      responses:
        '200':
          description: CSV file (`Content-Disposition` attachment)
          content:
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/payers/{id}:
    get:
      operationId: adminGetPayer
      tags: [Admin · Payers]
      summary: One payer's full picture
      description: |
        The record (with the full phone), the linked applicant or student, each obligation with its fee,
        balance, minimum next payment, ledger entries and payments, receipts, and the last 20 portal
        events for this ref. 404 for a payer outside a head of department's or dean's departments.
      x-permission: payers.read
      security: [{ adminJwt: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Payer, content: { application/json: { schema: { $ref: '#/components/schemas/PayerDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/clearance-policy:
    get:
      operationId: adminGetClearancePolicy
      tags: [Admin · Fee setup]
      summary: The exam-clearance rule
      description: '`placeholder: true` until the finance office sets the real rule.'
      x-permission: fees.read
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Rule, content: { application/json: { schema: { $ref: '#/components/schemas/ClearancePolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminPutClearancePolicy
      tags: [Admin · Fee setup]
      summary: Set the exam-clearance rule
      description: |
        A student is cleared when every obligation of `feeTypeCodes` in `period`, and (if
        `includeOverdue`) every obligation past its fee's due date, has a zero balance. Unknown fee
        type codes, or a rule that blocks nothing, are rejected (400). Clears `placeholder`. Audited
        (`clearance_policy.update`). Passes already issued re-check against the new rule.
      x-permission: clearance.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [examName, period, feeTypeCodes, includeOverdue]
              properties:
                examName: { type: string, minLength: 1, maxLength: 80, example: First semester exams }
                period: { type: string, minLength: 1, maxLength: 20, example: 2026/27 }
                feeTypeCodes: { type: array, maxItems: 20, items: { type: string }, example: [TUITION] }
                includeOverdue: { type: boolean }
      responses:
        '200': { description: The new rule, content: { application/json: { schema: { $ref: '#/components/schemas/ClearancePolicy' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/audit-log:
    get:
      operationId: adminAuditLog
      tags: [Admin · Users & audit]
      summary: Audit log (append-only)
      x-permission: audit.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: entity, in: query, schema: { type: string, maxLength: 50 }, example: Payout }
        - { name: entityId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: actorId, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Admin · faculties & departments ─────────────────────────────────────────
  /v1/admin/faculties:
    get:
      operationId: adminListFaculties
      tags: [Admin · Faculties & departments]
      summary: Every faculty with its departments (for dropdowns)
      description: Any signed-in admin. Includes inactive ones (filter on `active`). Departments needing review have no faculty, so they're only in `GET /v1/admin/departments`.
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Faculties, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FacultyWithDepartments' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: adminCreateFaculty
      tags: [Admin · Faculties & departments]
      summary: Add a faculty
      x-permission: academics.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { $ref: '#/components/schemas/AcademicCode' }
                name: { type: string, maxLength: 120 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Faculty' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/faculties/{code}:
    patch:
      operationId: adminUpdateFaculty
      tags: [Admin · Faculties & departments]
      summary: Rename or (de)activate a faculty
      description: Deactivating is refused (409) while it has active departments or active deans.
      x-permission: academics.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/FacultyCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                active: { type: boolean }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Faculty' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/departments:
    get:
      operationId: adminListDepartments
      tags: [Admin · Faculties & departments]
      summary: Departments, with their faculty
      description: Any signed-in admin. `needsReview=true` lists the ones the portal sent that an admin hasn't set up yet.
      security: [{ adminJwt: [] }]
      parameters:
        - { name: faculty, in: query, schema: { type: string, maxLength: 40 }, description: Faculty code }
        - { name: needsReview, in: query, schema: { type: boolean } }
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Departments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DepartmentListItem' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: adminCreateDepartment
      tags: [Admin · Faculties & departments]
      summary: Add a department to an active faculty
      x-permission: academics.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, facultyCode]
              properties:
                code: { $ref: '#/components/schemas/AcademicCode' }
                name: { type: string, maxLength: 120 }
                facultyCode: { type: string, maxLength: 40 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentListItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/departments/{code}:
    get:
      operationId: adminGetDepartment
      tags: [Admin · Faculties & departments]
      summary: A department
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/DepartmentPathCode' }]
      responses:
        '200': { description: Department, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentListItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminUpdateDepartment
      tags: [Admin · Faculties & departments]
      summary: Rename, move to another faculty, or (de)activate
      description: |
        Giving a department that needs review a faculty marks it reviewed (it needs one: 400 otherwise).
        Moving to an inactive faculty: 409. Deactivating is refused (409) while an active head of department
        or a rule on a fee that isn't closed uses it.
      x-permission: academics.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/DepartmentPathCode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                facultyCode: { type: string, maxLength: 40 }
                active: { type: boolean }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentListItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Admin · reports ─────────────────────────────────────────────────────────
  /v1/admin/reports/summary:
    get:
      tags: [Admin · Reports]
      operationId: adminReportsSummary
      summary: Collection totals by day, fee type and channel; payment funnel; commission and payouts
      description: |
        - **collected**: COMPLETED payments by `completedAt` in the range (a late settlement counts on
          the day Monime completed it). `monimeFees + platformFees + net = amount`.
        - **byDay**: every day of the range, zero-filled. Days are UTC (= Africa/Freetown).
        - **payments**: the funnel of payments *started* in the range, by current status (pending =
          awaiting payment, processing = Monime is processing it). Payments don't expire; unpaid ones are
          deleted after 7 days, so they leave the funnel.
        - **byFaculty** / **byDepartment**: collected, by the payer's department and that department's
          *current* faculty (`facultyCode: null` = department without a faculty yet, or no department).
        - **commission** / **payouts**: transfers / payouts created in the range. They are `null` unless
          the admin has `transfers.read` (super admins, or granted) / `payouts.read`, and always `null`
          for heads of department and deans.
        - Heads of department and deans only see their departments' payments (`filters.departments`).
      x-permission: reports.read
      security: [{ adminJwt: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Inclusive. Default: 29 days before `to`.' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Inclusive. Default: today. At most 366 days in all.' }
        - { name: feeType, in: query, schema: { type: string, maxLength: 20 }, example: TUITION }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/FacultyFilter'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  range:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      days: { type: integer }
                      timezone: { type: string, example: Africa/Freetown (UTC) }
                  filters:
                    type: object
                    properties:
                      feeType: { type: [string, 'null'] }
                      channel: { oneOf: [{ $ref: '#/components/schemas/Channel' }, { type: 'null' }] }
                      department: { type: [string, 'null'] }
                      faculty: { type: [string, 'null'] }
                      departments: { type: [array, 'null'], items: { type: string }, description: 'Department scope of a head of department or dean.' }
                  collected:
                    type: object
                    properties:
                      amount: { type: string, description: 'SLE minor units' }
                      count: { type: integer }
                      average: { type: string, description: 'SLE minor units' }
                      monimeFees: { type: string, description: 'SLE minor units' }
                      platformFees: { type: string, description: 'SLE minor units' }
                      net: { type: string, description: 'SLE minor units' }
                      lateSettlements: { type: integer, description: 'Completed after their hold expired.' }
                  byDay:
                    type: array
                    items: { type: object, properties: { date: { type: string, format: date }, amount: { type: string, description: 'SLE minor units' }, count: { type: integer } } }
                  byFeeType:
                    type: array
                    items:
                      type: object
                      properties:
                        feeTypeCode: { type: string }
                        feeTypeName: { type: string }
                        amount: { type: string, description: 'SLE minor units' }
                        count: { type: integer }
                        platformFees: { type: string, description: 'SLE minor units' }
                        net: { type: string, description: 'SLE minor units' }
                  byFaculty:
                    type: array
                    items:
                      type: object
                      properties:
                        facultyCode: { type: [string, 'null'] }
                        facultyName: { type: [string, 'null'] }
                        amount: { type: string, description: 'SLE minor units' }
                        count: { type: integer }
                  byDepartment:
                    type: array
                    items:
                      type: object
                      properties:
                        department: { type: [string, 'null'], description: Department code the portal sent }
                        departmentName: { type: [string, 'null'] }
                        facultyCode: { type: [string, 'null'] }
                        amount: { type: string, description: 'SLE minor units' }
                        count: { type: integer }
                  byChannel:
                    type: array
                    items: { type: object, properties: { channel: { $ref: '#/components/schemas/Channel' }, amount: { type: string, description: 'SLE minor units' }, count: { type: integer } } }
                  payments:
                    type: object
                    properties:
                      started: { type: integer }
                      completed: { $ref: '#/components/schemas/CountAmount' }
                      pending: { $ref: '#/components/schemas/CountAmount' }
                      processing: { $ref: '#/components/schemas/CountAmount' }
                      failed: { $ref: '#/components/schemas/CountAmount' }
                      expired: { $ref: '#/components/schemas/CountAmount', description: 'Payments made before payments stopped expiring (2026-11-28)' }
                      completionRate: { type: [number, 'null'], minimum: 0, maximum: 1 }
                  commission:
                    type: [object, 'null']
                    properties:
                      transferred: { $ref: '#/components/schemas/CountAmount' }
                      inFlight: { $ref: '#/components/schemas/CountAmount' }
                      failed: { $ref: '#/components/schemas/CountAmount' }
                  payouts:
                    type: [object, 'null']
                    properties:
                      paidOut: { $ref: '#/components/schemas/CountAmount' }
                      inFlight: { $ref: '#/components/schemas/CountAmount' }
                      failed: { $ref: '#/components/schemas/CountAmount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Admin · payments ────────────────────────────────────────────────────────
  /v1/admin/payments:
    get:
      operationId: adminListPayments
      tags: [Admin · Payments]
      summary: List payments
      description: Heads of department and deans only see their departments' payments.
      x-permission: payments.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: feeType, in: query, schema: { type: string, maxLength: 20 }, example: TUITION }
        - { name: payerRef, in: query, schema: { type: string, maxLength: 64 }, description: 'Student ID or application ref.' }
        - { name: ref, in: query, schema: { type: string, maxLength: 64 }, description: 'Our payment ref, Monime order number, or Monime payment id (spm-…).' }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/FacultyFilter'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPaymentPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/payments/export.csv:
    get:
      tags: [Admin · Payments]
      operationId: adminExportPayments
      summary: Download payments as CSV
      description: |
        Same filters as the list; oldest first; amounts in SLE (`1500.00`). At most 50,000 rows
        (narrow the filters beyond that: 400 `VALIDATION`). Heads of department and deans get only their
        departments. Cells starting with `= + - @` are prefixed with `'` (no spreadsheet formulas).
        UTF-8 with BOM. Every export is audited (`payments.export`).

        Columns: created_at, completed_at, payment_ref, status, channel, collection_method, fee_type,
        fee_name, payer_kind, payer_ref, payer_name, program, department, department_name, faculty,
        faculty_name, amount_sle, monime_fee_sle,
        platform_fee_sle, net_sle, payer_phone, monime_order_number, monime_payment_id,
        receipt_number, failure_reason, payment_id.
      x-permission: payments.export
      security: [{ adminJwt: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PaymentStatus' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/Channel' } }
        - { name: feeType, in: query, schema: { type: string, maxLength: 20 } }
        - { name: payerRef, in: query, schema: { type: string, maxLength: 64 } }
        - { name: ref, in: query, schema: { type: string, maxLength: 64 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/DepartmentFilter'
        - $ref: '#/components/parameters/FacultyFilter'
      responses:
        '200':
          description: CSV file (`Content-Disposition` attachment)
          content:
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/payments/{id}:
    get:
      operationId: adminGetPayment
      tags: [Admin · Payments]
      summary: A payment with its ledger entry and commission transfer
      x-permission: payments.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/AdminPaymentDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/payments/{id}/reconcile:
    post:
      operationId: adminReconcilePayment
      tags: [Admin · Payments]
      summary: Ask Monime about an open payment
      description: Reports what Monime says about the payment code; never changes the payment (payments don't expire). Completion only ever comes from Monime's webhook or the nightly reconciliation.
      x-permission: payments.reconcile
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Before / after, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentReconcileResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Admin · fee setup ───────────────────────────────────────────────────────
  /v1/admin/fee-types:
    get:
      operationId: adminFeeTypes
      tags: [Admin · Fee setup]
      summary: Fee types with their Monime account
      x-permission: fees.read
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Fee types, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeeTypeListItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateFeeType
      tags: [Admin · Fee setup]
      summary: Create a fee type and its Monime financial account
      description: |
        The account (`unimak-fee-<code>`) is created in the same call. If Monime is unreachable
        the fee type is still saved, `accountError` says why, and
        `POST /v1/admin/fee-types/{id}/account` retries.
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, payerKind, recurrence]
              properties:
                code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,19}$', example: LIB }
                name: { type: string, minLength: 2, maxLength: 100 }
                payerKind: { type: string, enum: [APPLICANT, STUDENT] }
                recurrence: { type: string, enum: [ONCE, PER_YEAR] }
      responses:
        '201': { description: Created (accountError says why the Monime account is missing), content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/FeeTypeWithAccount' }, { type: object, required: [accountError], properties: { accountError: { type: [string, 'null'] } } }] } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/fee-types/{id}:
    patch:
      operationId: adminRenameFeeType
      tags: [Admin · Fee setup]
      summary: Rename a fee type
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 2, maxLength: 100 } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/FeeType' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/fee-types/{id}/account:
    post:
      operationId: adminFeeTypeAccount
      tags: [Admin · Fee setup]
      summary: Create (or link) the fee type's Monime account — idempotent
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionedAccount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Upstream' }

  /v1/admin/fees:
    get:
      operationId: adminFees
      tags: [Admin · Fee setup]
      summary: List fees
      x-permission: fees.read
      security: [{ adminJwt: [] }]
      parameters:
        - { name: feeType, in: query, schema: { type: string, maxLength: 20 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FeeStatus' } }
      responses:
        '200': { description: Fees, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeeListItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreateFee
      tags: [Admin · Fee setup]
      summary: Create a fee (DRAFT)
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feeTypeId, name, period, allowInstalments]
              properties:
                feeTypeId: { type: string, format: uuid }
                name: { type: string, minLength: 2, maxLength: 100, example: Tuition 2026/27 }
                period: { type: string, pattern: '^[A-Za-z0-9/-]{4,20}$', examples: ['2026/27', '2026-SEP'] }
                allowInstalments: { type: boolean }
                defaultMinInstalment: { $ref: '#/components/schemas/MinorAmount' }
                dueDate: { type: string, format: date }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Fee' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/fees/{id}:
    get:
      operationId: adminFee
      tags: [Admin · Fee setup]
      summary: A fee with its rate, eligibility and instalment rules
      x-permission: fees.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Fee, content: { application/json: { schema: { $ref: '#/components/schemas/FeeDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: adminUpdateFee
      tags: [Admin · Fee setup]
      summary: Update a fee or change its status
      description: |
        Status: DRAFT → ACTIVE → CLOSED, and CLOSED → ACTIVE. Activating needs at least one
        rate rule and a fee type with a Monime account. A closed fee creates no new obligations.
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                allowInstalments: { type: boolean }
                defaultMinInstalment: { oneOf: [{ $ref: '#/components/schemas/MinorAmount' }, { type: 'null' }], description: 'null clears it' }
                dueDate: { type: [string, 'null'], format: date }
                status: { $ref: '#/components/schemas/FeeStatus' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Fee' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/fees/{id}/preview:
    get:
      operationId: adminPreview
      tags: [Admin · Fee setup]
      summary: What a given payer would owe (writes nothing)
      x-permission: fees.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: kind, in: query, required: true, schema: { type: string, enum: [applicant, student] } }
        - { name: ref, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_/-]{1,64}$' }, example: UNI-2025-0003 }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/FeePreview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/fees/{id}/reprice:
    get:
      operationId: adminPreviewReprice
      tags: [Admin · Fee setup]
      summary: What re-pricing would change (writes nothing)
      description: |
        Obligations copy their amount from the best rate rule when they're created; editing a rule
        doesn't change them. This lists what applying would do: untouched obligations (OPEN, no
        payment or refund, no payment in progress) move to the current best rule; the rest are
        listed under `skipped` with the reason, for a person to decide.
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/RepriceReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      operationId: adminApplyReprice
      tags: [Admin · Fee setup]
      summary: Move untouched obligations to the current rate rules
      description: |
        Decides again under lock, then for each change appends an ADJUSTMENT ledger entry for the
        difference and updates the obligation's amount. Audited as `fee.reprice`. Running it again
        changes nothing.
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/RepriceReport' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/fees/{id}/rate-rules:
    post:
      operationId: adminAddRateRule
      tags: [Admin · Fee setup]
      summary: Add a rate rule
      description: The most specific matching rule wins. A rule that would make some payer's price ambiguous is refused (409 `AMBIGUOUS_RATE_RULE`, the message names the tie-breaker to add first).
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/RateRule' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RateRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/fees/{id}/rate-rules/{ruleId}:
    put:
      operationId: adminUpdateRateRule
      tags: [Admin · Fee setup]
      summary: Replace a rate rule
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/RuleId' }]
      requestBody: { $ref: '#/components/requestBodies/RateRule' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RateRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: adminDeleteRateRule
      tags: [Admin · Fee setup]
      summary: Delete a rate rule (refused if it breaks a tie)
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/RuleId' }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/Deleted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/fees/{id}/eligibility-rules:
    post:
      operationId: adminAddEligibility
      tags: [Admin · Fee setup]
      summary: Add an eligibility rule
      description: No eligibility rules = everyone of the fee type's payer kind. With rules, a payer must match at least one.
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Matchers'
                - type: object
                  properties: { finalYear: { type: [boolean, 'null'] } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/fees/{id}/eligibility-rules/{ruleId}:
    delete:
      operationId: adminDeleteEligibility
      tags: [Admin · Fee setup]
      summary: Delete an eligibility rule
      x-permission: fees.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/RuleId' }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/Deleted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/fees/{id}/instalment-rules/{department}:
    put:
      operationId: adminSetInstalment
      tags: [Admin · Fee setup]
      summary: Set the minimum instalment for a department, optionally for one level
      description: |
        The department must exist, be active and reviewed (400 otherwise). Its payers can't pay less per
        instalment. With `?level=`, the rule is for students of that level only; without it, for every
        level (and for applicants, who have no level). A student's own level rule wins over the
        all-levels rule. Setting the same department and level again updates the rule.
      x-permission: instalments.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/DepartmentCode' }, { $ref: '#/components/parameters/InstalmentLevel' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [minInstalment], properties: { minInstalment: { $ref: '#/components/schemas/MinorAmount' } } }
      responses:
        '200': { description: Rule, content: { application/json: { schema: { $ref: '#/components/schemas/InstalmentRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: adminDeleteInstalment
      tags: [Admin · Fee setup]
      summary: Remove a department's (or one level's) minimum instalment
      description: Without `?level=` removes the all-levels rule. Removing a level rule makes that level fall back to the all-levels rule, then the fee default.
      x-permission: instalments.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/DepartmentCode' }, { $ref: '#/components/parameters/InstalmentLevel' }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { $ref: '#/components/schemas/Deleted' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Admin · treasury ────────────────────────────────────────────────────────
  /v1/admin/financial-accounts:
    get:
      operationId: adminListAccounts
      tags: [Admin · Treasury]
      summary: Our Monime financial accounts (one per fee type + platform)
      x-permission: accounts.read
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Accounts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AccountListItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/financial-accounts/provision:
    post:
      operationId: adminProvisionAccounts
      tags: [Admin · Treasury]
      summary: Create any missing accounts (all fee types + platform) — idempotent
      x-permission: accounts.manage
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Accounts (all fee types + platform), content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProvisionedAccount' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Upstream' }

  /v1/admin/financial-accounts/{id}/refresh-balance:
    post:
      operationId: adminRefreshBalance
      tags: [Admin · Treasury]
      summary: Fetch the account's balance from Monime
      x-permission: accounts.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Account with fresh balance, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialAccount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Upstream' }

  /v1/admin/banks:
    get:
      operationId: adminBanks
      tags: [Admin · Treasury]
      summary: Banks Monime can pay out to
      x-permission: payouts.read
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Banks, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Bank' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/payouts:
    get:
      operationId: adminListPayouts
      tags: [Admin · Treasury]
      summary: List payouts
      x-permission: payouts.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PayoutStatus' } }
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminCreatePayout
      tags: [Admin · Treasury]
      summary: Withdraw to a bank account (Monime payout)
      description: Audited. Idempotent on `idempotencyKey`. The result arrives by `payout.completed|failed` webhook.
      x-permission: payouts.manage
      security: [{ adminJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, amount, bankProviderId, accountNumber, idempotencyKey]
              properties:
                account: { type: string, maxLength: 64, description: 'Account reference (unimak-fee-tuition) or Monime id (fac-…).' }
                amount: { $ref: '#/components/schemas/MinorAmount' }
                bankProviderId: { type: string, pattern: '^[a-z0-9]{2,20}$', example: slb001 }
                accountNumber: { type: string, pattern: '^\d{4,34}$' }
                accountName: { type: string, maxLength: 100 }
                narration: { type: string, maxLength: 100 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 64 }
      responses:
        '201': { description: Submitted (or the existing payout for this idempotencyKey), content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Upstream' }

  /v1/admin/payouts/{id}:
    get:
      operationId: adminGetPayout
      tags: [Admin · Treasury]
      summary: A payout
      x-permission: payouts.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payout, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/transfers:
    get:
      operationId: adminListTransfers
      tags: [Admin · Treasury]
      summary: Commission transfers (fee account → platform account)
      description: |
        Super admins only, unless `transfers.read` is granted on its own. Without it, payment details show
        `commissionTransfer: null`, the reconciliation summary shows `null` for transfers, and
        commission-transfer outbox messages are hidden.
      x-permission: transfers.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - $ref: '#/components/parameters/Sort'
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/TransferPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/transfers/{id}:
    get:
      tags: [Admin · Treasury]
      operationId: adminGetTransfer
      summary: A commission transfer
      x-permission: transfers.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Transfer, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/transfers/{id}/retry:
    post:
      operationId: adminRetryTransfer
      tags: [Admin · Treasury]
      summary: Retry a FAILED transfer (new attempt, new idempotency key)
      x-permission: transfers.retry
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Transfer after the new attempt, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/outbox:
    get:
      operationId: adminOutbox
      tags: [Admin · Treasury]
      summary: Outbox messages (portal notifications, commission transfers)
      x-permission: outbox.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OutboxStatus' } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/OutboxMessagePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/outbox/{id}:
    get:
      tags: [Admin · Treasury]
      operationId: adminGetOutbox
      summary: An outbox message
      x-permission: outbox.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Message, content: { application/json: { schema: { $ref: '#/components/schemas/OutboxMessage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/outbox/{id}/retry:
    post:
      operationId: adminRetryOutbox
      tags: [Admin · Treasury]
      summary: Retry a DEAD outbox message now
      x-permission: outbox.retry
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Message after the retry, content: { application/json: { schema: { $ref: '#/components/schemas/OutboxMessage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── Admin · reconciliation ──────────────────────────────────────────────────
  /v1/admin/reconciliation:
    get:
      operationId: adminReconciliation
      tags: [Admin · Reconciliation]
      summary: What needs attention
      description: Open reconciliation items, unmatched/failed webhook events, failed or stuck transfers and payouts, dead outbox messages, stale open payments.
      x-permission: reconciliation.read
      security: [{ adminJwt: [] }]
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/reconciliation/runs:
    get:
      operationId: adminRuns
      tags: [Admin · Reconciliation]
      summary: Reconciliation runs
      x-permission: reconciliation.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReconciliationRunStatus' } }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRunPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminStartRun
      tags: [Admin · Reconciliation]
      summary: Reconcile a UTC day against Monime
      description: Auto-settles payments whose webhook never arrived; flags unmatched or missing payments, fee mismatches and commission problems.
      x-permission: reconciliation.manage
      security: [{ adminJwt: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { date: { type: string, format: date, description: 'Default: yesterday (UTC).' } } }
      responses:
        '201': { description: The finished run with its items, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRunDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Upstream' }

  /v1/admin/reconciliation/runs/{id}:
    get:
      operationId: adminRun
      tags: [Admin · Reconciliation]
      summary: A run with its items
      x-permission: reconciliation.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Run, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationRunDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/reconciliation/items:
    get:
      tags: [Admin · Reconciliation]
      operationId: adminListItems
      summary: Reconciliation items across runs
      x-permission: reconciliation.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ReconciliationItemStatus' } }
        - { name: runId, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string, maxLength: 50 }, description: 'e.g. MISSING_PAYMENT, FEE_MISMATCH' }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationItemPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/reconciliation/webhook-events:
    get:
      tags: [Admin · Reconciliation]
      operationId: adminListWebhookEvents
      summary: Received Monime webhook events (without payloads)
      x-permission: reconciliation.read
      security: [{ adminJwt: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string, maxLength: 100 }, description: '`nextCursor` of the previous page (event ids are Monime ids, not UUIDs).' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/WebhookEventStatus' } }
        - { name: type, in: query, schema: { type: string, maxLength: 100 }, example: payment.processing_completed }
        - { name: unresolved, in: query, schema: { type: boolean }, description: 'true: only events nobody has resolved yet.' }
      responses:
        '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEventPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/reconciliation/items/{id}/resolve:
    post:
      operationId: adminResolveItem
      tags: [Admin · Reconciliation]
      summary: Resolve a reconciliation item (audited)
      x-permission: reconciliation.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Resolution' }
      responses:
        '200': { description: Resolved item, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationItem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/reconciliation/webhook-events/{id}:
    get:
      operationId: adminWebhookEvent
      tags: [Admin · Reconciliation]
      summary: A stored webhook event (with payload)
      x-permission: reconciliation.read
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { description: Event with payload, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEvent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/reconciliation/webhook-events/{id}/resolve:
    post:
      operationId: adminResolveEvent
      tags: [Admin · Reconciliation]
      summary: Mark an unmatched/failed event resolved (audited)
      x-permission: reconciliation.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody: { $ref: '#/components/requestBodies/Resolution' }
      responses:
        '200': { description: Resolved event, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookEvent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/reconciliation/webhook-events/{id}/replay:
    post:
      operationId: adminReplayEvent
      tags: [Admin · Reconciliation]
      summary: Process a stored event again (e.g. after fixing data)
      x-permission: reconciliation.manage
      security: [{ adminJwt: [] }]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { description: Processing result, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookAck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Dev ─────────────────────────────────────────────────────────────────────
  /dev/monime/simulate-webhook:
    post:
      operationId: devSimulate
      tags: [Dev]
      summary: Simulate Monime for a payment, transfer or payout (not in production)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              description: Exactly one of paymentId / transferId / payoutId.
              properties:
                paymentId: { type: string, format: uuid }
                transferId: { type: string, format: uuid }
                payoutId: { type: string, format: uuid }
                outcome: { type: string, enum: [processing, completed, failed, expired] }
                amount: { $ref: '#/components/schemas/MinorAmount' }
                payerPhone: { type: string, pattern: '^\+\d{8,15}$', description: 'Reported masked, like Monime.' }
                metadata: { type: object, additionalProperties: { type: string } }
                deliver: { type: boolean, description: 'false: recorded at Monime only (missed webhook).' }
                eventId: { type: string, maxLength: 100 }
      responses:
        '200': { $ref: '#/components/responses/Any' }

components:
  securitySchemes:
    channelHmac:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Three headers on every request:
        - `x-api-key`: the client's API key
        - `x-timestamp`: unix seconds (within 300 s of server time)
        - `x-signature`: hex `HMAC-SHA256(secret, "<x-timestamp>.<raw request body>")` (empty body for GET)

        Example (Node): `createHmac('sha256', secret).update(ts + '.' + body).digest('hex')`.
        `pnpm channel GET /v1/channel/...` signs for you.
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token (email + password or OAuth). The user must be invited
        (`AdminUser`); super admins and bursars need 2FA (`aal2`). Each operation lists its
        permission in `x-permission`.
    monimeSignature:
      type: apiKey
      in: header
      name: Monime-Signature
    portalSignature:
      type: apiKey
      in: header
      name: X-Portal-Signature
      description: |
        Two headers (docs/portal-events.md A2):
        - `X-Portal-Timestamp`: unix seconds (within 300 s of server time)
        - `X-Portal-Signature`: `v1=` + hex `HMAC-SHA256(PORTAL_EVENTS_SECRET, "<timestamp>.<raw body>")`
        The previous secret (`PORTAL_EVENTS_SECRET_PREVIOUS`) is also accepted during rotation.
    cronSecret:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer $CRON_SECRET` (what Vercel Cron sends).'

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: id, in: path, required: true, schema: { type: string }, description: 'Monime event id.' }
    DepartmentCode: { name: department, in: path, required: true, schema: { type: string, maxLength: 40 }, example: NURSING, description: 'Department code (exact, case-sensitive).' }
    FacultyCode: { name: code, in: path, required: true, schema: { type: string, maxLength: 40 }, example: FAC-NURSING-AHS }
    DepartmentPathCode: { name: code, in: path, required: true, schema: { type: string, maxLength: 40 }, example: NURSING }
    DepartmentFilter: { name: department, in: query, schema: { type: string, maxLength: 40 }, example: NURSING, description: Department code. }
    FacultyFilter: { name: faculty, in: query, schema: { type: string, maxLength: 40 }, example: FAC-NURSING-AHS, description: 'Faculty code: its departments as they are now.' }
    PayerKind: { name: kind, in: path, required: true, schema: { type: string, enum: [applicant, student] } }
    UserAlias:
      name: X-User-Alias
      in: header
      required: false
      description: |
        Dot 0.2.3+: the Dash account's phone number (or email when it has none), from Dash sign-in,
        e.g. `+232 76 123456`. Phones are compared on their national number (`076123456`,
        `23276123456` and `+232 76 123456` are the same); an email is compared with the email the
        portal gave us, ignoring case.
        A check, not a login: the dot sets it itself. Failed matches are limited per IP and per ID;
        it is never returned and only logged masked.
      schema: { type: string, maxLength: 254 }
    PayerRef: { name: ref, in: path, required: true, schema: { type: string }, examples: { student: { value: UNI-2025-0002 }, applicant: { value: APP-2026-0001 } } }
    AnalyticsFeeId: { name: feeId, in: query, schema: { type: string, format: uuid }, description: One fee. }
    AnalyticsFeeType: { name: feeType, in: query, schema: { type: string, maxLength: 40 }, example: TUITION, description: Fee type code. }
    AnalyticsPeriod: { name: period, in: query, schema: { type: string, maxLength: 20 }, example: 2026/27, description: Fee period. }
    AnalyticsLevel: { name: level, in: query, schema: { type: integer, minimum: 1, maximum: 10 } }
    AnalyticsIncludeInactive: { name: includeInactive, in: query, schema: { type: boolean, default: false }, description: 'Count suspended, withdrawn and graduated students too.' }
    AnalyticsKind: { name: kind, in: query, schema: { type: string, enum: [STUDENT, APPLICANT] } }
    AnalyticsStanding: { name: standing, in: query, schema: { type: string, enum: [NOT_BILLED, PAID, PART_PAID, UNPAID, OVERDUE] }, description: 'OVERDUE = outstanding on a fee past its due date.' }
    AnalyticsEnrolmentStatus: { name: enrolmentStatus, in: query, schema: { $ref: '#/components/schemas/EnrolmentStatus' } }
    AnalyticsSearch: { name: q, in: query, schema: { type: string, maxLength: 64 }, description: Ref or name contains. }
    AnalyticsSort: { name: sort, in: query, schema: { type: string, enum: ['-balance', balance, name, ref], default: '-balance' } }
    InstalmentLevel: { name: level, in: query, required: false, description: 'Student level 1-10. Omitted = every level of the department.', schema: { type: integer, minimum: 1, maximum: 10 } }
    UssdToken: { name: token, in: path, required: true, schema: { type: string }, description: 'Secret path token (USSD_EXCHANGE_PATH_TOKEN).' }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string, format: uuid }, description: '`nextCursor` of the previous page.' }
    Sort: { name: sort, in: query, schema: { type: string, enum: [createdAt, -createdAt, amount, -amount], default: -createdAt }, description: '`-` = descending. Ties break on id, so cursor paging stays stable.' }

  requestBodies:
    RateRule:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Matchers'
              - type: object
                required: [amount]
                properties: { amount: { $ref: '#/components/schemas/MinorAmount' } }
    Resolution:
      required: true
      content:
        application/json:
          schema: { type: object, required: [resolution], properties: { resolution: { type: string, minLength: 3, maxLength: 500 } } }

  responses:
    Any: { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    BadRequest: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } } }
    Unauthorized: { description: Missing or invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Missing permission, not an admin, or 2FA required', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AliasForbidden:
      description: |
        `ALIAS_REQUIRED` (no `X-User-Alias`) or `ALIAS_MISMATCH` (another number). `message` is written
        for the student; show it as it is.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: ALIAS_MISMATCH, message: "This ID isn't linked to the Dash number you're using. Use the number the university has for you, or contact the finance office.", details: null } }
    Unprocessable: { description: Amount or rule not acceptable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited:
      description: Too many requests from this IP; retry after `Retry-After` seconds
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Upstream: { description: Monime or the portal is unavailable — retry with the same idempotency key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    MinorAmount: { type: string, pattern: '^[1-9]\d{0,17}$', example: '150000', description: 'SLE minor units (1 SLE = 100). Integers are accepted in requests.' }
    Money:
      type: object
      required: [value, display]
      properties:
        value: { type: string, example: '150000' }
        display: { type: string, example: 'SLE 1,500.00' }
    PaymentRef: { type: string, pattern: '^[1-9]\d{7}$', example: '15540719', description: '8-digit ref to give the payer for status checks.' }
    DotPayer:
      type: object
      required: [kind, ref, fullName, maskedPhone, maskedEmail, programCode, programLine, department, departmentName, facultyCode, facultyName, level, finalYear, residency, intake, applicantStatus, stale]
      properties:
        kind: { type: string, enum: [applicant, student] }
        ref: { type: string, example: UNI-2026-0001 }
        fullName: { type: string, example: Abdul Koroma }
        maskedPhone: { type: [string, 'null'], example: '+232*****001' }
        maskedEmail: { type: [string, 'null'], example: 'a***@gmail.com', description: 'null when the portal has no email' }
        programCode: { type: string, example: BSC-CS }
        programLine: { type: string, example: 'BSC-CS · Level 1' }
        department: { type: [string, 'null'], example: COMPUTER-SCI }
        departmentName: { type: [string, 'null'], example: Computer Science, description: 'null when the department is unknown or not yet listed' }
        facultyCode: { type: [string, 'null'] }
        facultyName: { type: [string, 'null'] }
        level: { type: [integer, 'null'], description: 'Students only' }
        finalYear: { type: [boolean, 'null'], description: 'Students only' }
        residency: { $ref: '#/components/schemas/Residency' }
        intake: { type: string, example: 2026-SEP }
        applicantStatus: { type: [string, 'null'], description: 'Applicants only (e.g. APPLIED, ADMITTED)' }
        stale: { type: boolean, description: 'true when the portal was down and this is the last snapshot' }
    DotPayerShort:
      type: object
      description: 'The lookup for someone whose X-User-Alias does not match (a sponsor): enough to pay, nothing more.'
      required: [kind, ref, shortName, limited, stale]
      properties:
        kind: { type: string, enum: [applicant, student] }
        ref: { type: string }
        shortName: { type: string, example: Abdul K., description: First name and last initial }
        limited: { const: true }
        stale: { type: boolean }
    DotPaymentRequest:
      type: object
      required: [obligationId, amount]
      properties:
        obligationId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/MinorAmount' }
        payRequestCode: { type: string, maxLength: 20, description: 'Pay through this pay request (dot 0.2.3+).' }
        paidByName: { type: string, maxLength: 40, description: "Payer's first name, display only; anything after the first word is dropped." }
        payingForSelf: { type: boolean, description: 'true when the student saved on that phone is paying; display only. Default false.' }
    PaidBy:
      type: object
      required: [name, self]
      description: 'Who paid, as the dot said (display only): `paidByName` and `payingForSelf` from POST /v1/dot/payments. Never a phone.'
      properties:
        name: { type: [string, 'null'], example: Fatmata }
        self: { type: boolean }
    PaymentMethodLabel: { type: [string, 'null'], enum: [Mobile money, Card, Bank, Wallet, null], description: "From Monime's Payment channel.type (momo, card, bank, wallet); null if unknown." }
    PaymentHistory:
      type: object
      required: [academicYear, totalPaid, payments]
      properties:
        academicYear: { type: [string, 'null'], example: 2026/27 }
        totalPaid: { $ref: '#/components/schemas/Money' }
        payments:
          type: array
          items:
            type: object
            required: [paymentRef, obligationId, feeName, period, amount, status, paidBy, method, receiptNumber, createdAt, completedAt]
            properties:
              paymentRef: { $ref: '#/components/schemas/PaymentRef' }
              obligationId: { type: string, format: uuid }
              feeName: { type: string }
              period: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              status: { $ref: '#/components/schemas/PaymentStatus' }
              paidBy: { $ref: '#/components/schemas/PaidBy' }
              method: { $ref: '#/components/schemas/PaymentMethodLabel' }
              receiptNumber: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              completedAt: { type: [string, 'null'], format: date-time }
    DotReceipt:
      type: object
      required: [receiptNumber, paymentRef, amount, feeName, period, payer, paidBy, method, issuedAt, verifyUrl, pdfUrl]
      properties:
        receiptNumber: { type: string, example: UNIMAK-2026-000123 }
        paymentRef: { $ref: '#/components/schemas/PaymentRef' }
        amount: { $ref: '#/components/schemas/Money' }
        feeName: { type: string }
        period: { type: string }
        payer:
          type: object
          required: [kind, ref, fullName, programLine]
          properties:
            kind: { type: string, enum: [applicant, student] }
            ref: { type: string }
            fullName: { type: string }
            programLine: { type: string }
        paidBy: { $ref: '#/components/schemas/PaidBy' }
        method: { $ref: '#/components/schemas/PaymentMethodLabel' }
        issuedAt: { type: string, format: date-time }
        verifyUrl: { type: string, format: uri }
        pdfUrl: { type: 'null', description: 'Not made yet.' }
    Clearance:
      type: object
      required: [status, exam, outstanding, blocking, passCode, verifyUrl, issuedAt]
      properties:
        status: { type: string, enum: [CLEARED, NOT_CLEARED] }
        exam:
          type: object
          required: [name, period]
          properties:
            name: { type: string }
            period: { type: string }
        outstanding: { $ref: '#/components/schemas/Money' }
        blocking:
          type: array
          items:
            type: object
            required: [obligationId, feeName, balance]
            properties:
              obligationId: { type: string, format: uuid }
              feeName: { type: string }
              balance: { $ref: '#/components/schemas/Money' }
        passCode: { type: [string, 'null'], example: 7KQ2MX9P }
        verifyUrl: { type: [string, 'null'], format: uri }
        issuedAt: { type: [string, 'null'], format: date-time }
    ClearancePolicy:
      type: object
      required: [id, examName, period, feeTypeCodes, includeOverdue, placeholder, updatedBy, updatedAt]
      properties:
        id: { const: current }
        examName: { type: string }
        period: { type: string }
        feeTypeCodes: { type: array, items: { type: string } }
        includeOverdue: { type: boolean }
        placeholder: { type: boolean, description: 'true until the finance office sets the real rule' }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    PayRequest:
      type: object
      required: [code, shareUrl, obligationId, feeName, amount, paid, status, message, requester, recipientName, contributions, openedAt, createdAt, expiresAt]
      properties:
        code: { type: string, example: K7PQ2XA }
        shareUrl: { type: string, format: uri, description: '`${DOT_LINK}/sponsor?request=&kind=&ref=&fee=&amount=` (amount empty when null)' }
        obligationId: { type: string, format: uuid }
        feeName: { type: string }
        amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        paid: { $ref: '#/components/schemas/Money' }
        status:
          type: string
          enum: [OPEN, PARTLY_PAID, PAID, CANCELLED, EXPIRED]
          description: |
            From its COMPLETED payments only. PAID: reached `amount`, or the fee was paid off with its
            help; a fee paid off without it reads EXPIRED.
        message: { type: string }
        requester:
          type: object
          required: [kind, ref, firstName, programLine]
          properties:
            kind: { type: string, enum: [applicant, student] }
            ref: { type: string }
            firstName: { type: string }
            programLine: { type: string, example: 'BSC-CS · Level 1' }
        recipientName: { type: [string, 'null'] }
        contributions:
          type: array
          items:
            type: object
            required: [paymentRef, name, amount, paidAt]
            properties:
              paymentRef: { $ref: '#/components/schemas/PaymentRef' }
              name: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
              paidAt: { type: string, format: date-time }
        openedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    DotAmountRequest:
      type: object
      required: [obligationId, amount]
      properties:
        obligationId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/MinorAmount' }
    DashOrder:
      type: object
      description: 'The `order` for dash.payments.request(). `reference` is our payment id; unitPrice.value is a number of minor units.'
      required: [name, reference, lineItems, metadata]
      properties:
        name: { type: string, maxLength: 64, example: UNIMAK Tuition 2026/27 }
        reference: { type: string, format: uuid }
        lineItems:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [name, unitPrice, quantity]
            properties:
              name: { type: string, maxLength: 64 }
              unitPrice:
                type: object
                required: [currency, value]
                properties:
                  currency: { const: SLE }
                  value: { type: integer, example: 150000 }
              quantity: { const: 1 }
        metadata: { type: object, additionalProperties: { type: string } }
    RepriceReport:
      type: object
      required: [fee, applied, changes, skipped, unchanged, totals]
      properties:
        fee: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } }
        applied: { type: boolean }
        changes:
          type: array
          items:
            type: object
            required: [obligationId, payer, current, proposed, difference, rateRuleId]
            properties:
              obligationId: { type: string, format: uuid }
              payer: { $ref: '#/components/schemas/RepricePayer' }
              current: { type: string, description: 'SLE minor units' }
              proposed: { type: string, description: 'SLE minor units' }
              difference: { type: string, description: 'proposed - current, may be negative' }
              rateRuleId: { type: string, format: uuid }
        skipped:
          type: array
          items:
            type: object
            required: [obligationId, payer, current, reason]
            properties:
              obligationId: { type: string, format: uuid }
              payer: { $ref: '#/components/schemas/RepricePayer' }
              current: { type: string, description: 'SLE minor units' }
              reason: { type: string, enum: [PAID, HAS_PAYMENTS, PAYMENT_IN_PROGRESS, NOT_ELIGIBLE, NO_RATE_RULE, AMBIGUOUS_RATE_RULE] }
        unchanged: { type: integer, description: 'Obligations already at the current price' }
        totals:
          type: object
          required: [obligations, changed, difference]
          properties:
            obligations: { type: integer }
            changed: { type: integer }
            difference: { type: string, description: 'Sum of differences, SLE minor units' }
    RepricePayer:
      type: object
      required: [kind, ref, fullName]
      properties:
        kind: { type: string, enum: [applicant, student] }
        ref: { type: string }
        fullName: { type: string }
    PortalEventIn:
      type: object
      description: One event (docs/portal-events.md A3-A4). `data` is the full current record.
      required: [id, type, occurredAt, data]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$', description: 'Unique per event; reuse it when retrying.' }
        type: { type: string, enum: [applicant.upserted, student.upserted] }
        occurredAt: { type: string, format: date-time }
        data: { oneOf: [{ $ref: '#/components/schemas/PortalApplicantRecord' }, { $ref: '#/components/schemas/PortalStudentRecord' }] }
    PortalApplicantRecord:
      type: object
      required: [applicationRef, fullName, phone, programCode, department, intake, residency, status, updatedAt]
      properties:
        applicationRef: { type: string, example: APP-2026-0001 }
        fullName: { type: string }
        phone: { type: string, pattern: '^\+\d{8,15}$', example: '+23276100001' }
        email: { type: [string, 'null'], maxLength: 254, format: email, description: 'Optional. Absent: we keep the email we hold. null: none (clears it).' }
        programCode: { type: string, example: BSC-CS }
        department: { type: string, example: COMPUTER-SCI }
        intake: { type: string, example: 2026-SEP }
        residency: { type: string, enum: [LOCAL, INTERNATIONAL] }
        status: { type: string, enum: [APPLIED, ADMITTED, REJECTED, WITHDRAWN] }
        updatedAt: { type: string, format: date-time, description: 'Must increase on every change; older versions are ignored.' }
    PortalStudentRecord:
      type: object
      required: [studentId, fullName, phone, programCode, department, level, finalYear, residency, intake, enrolmentStatus, updatedAt]
      properties:
        studentId: { type: string, example: UNI-2026-0001 }
        applicationRef: { type: [string, 'null'], description: 'The application this student came from.' }
        fullName: { type: string }
        phone: { type: string, pattern: '^\+\d{8,15}$' }
        email: { type: [string, 'null'], maxLength: 254, format: email, description: 'Optional. Absent: we keep the email we hold. null: none (clears it).' }
        programCode: { type: string }
        department: { type: string }
        level: { type: integer, minimum: 1, maximum: 10 }
        finalYear: { type: boolean }
        residency: { type: string, enum: [LOCAL, INTERNATIONAL] }
        intake: { type: string }
        enrolmentStatus: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN, GRADUATED] }
        updatedAt: { type: string, format: date-time }
    NeedsReviewPayer:
      type: object
      required: [id, ref, fullName, department, level, enrolmentStatus, statusSince, obligations, totalBalance]
      properties:
        id: { type: string, format: uuid }
        ref: { type: string }
        fullName: { type: string }
        department: { type: [string, 'null'] }
        level: { type: [integer, 'null'] }
        enrolmentStatus: { type: string, enum: [SUSPENDED, WITHDRAWN, GRADUATED] }
        statusSince: { type: [string, 'null'], format: date-time, description: "The portal's updatedAt of the record that set the status" }
        obligations:
          type: array
          items:
            type: object
            required: [id, feeName, period, amount, balance]
            properties:
              id: { type: string, format: uuid }
              feeName: { type: string }
              period: { type: string }
              amount: { type: string, description: 'SLE minor units' }
              balance: { type: string, description: 'SLE minor units' }
        totalBalance: { type: string, description: 'SLE minor units' }
    EnrolmentStatus: { type: string, enum: [ACTIVE, SUSPENDED, WITHDRAWN, GRADUATED] }
    Standing: { type: string, enum: [NOT_BILLED, PAID, PART_PAID, UNPAID], description: 'NOT_BILLED: no obligations selected; PAID: nothing outstanding; PART_PAID: something collected and outstanding; UNPAID: nothing collected.' }
    OutstandingTotals:
      type: object
      required: [students, billed, collected, outstanding, paid, partPaid, unpaid, overdue, overdueAmount, collectionRate]
      properties:
        students: { type: integer }
        billed: { type: string, description: 'SLE minor units' }
        collected: { type: string, description: 'SLE minor units' }
        outstanding: { type: string, description: 'SLE minor units' }
        paid: { type: integer }
        partPaid: { type: integer }
        unpaid: { type: integer }
        overdue: { type: integer, description: Students with something overdue }
        overdueAmount: { type: string, description: 'SLE minor units' }
        collectionRate: { type: [number, 'null'], description: 'collected ÷ billed, 0–1; null when nothing is billed' }
    OutstandingReport:
      type: object
      required: [asOf, filters, totals, grid, byFee, applicants, roster]
      properties:
        asOf: { type: string, format: date-time }
        filters:
          type: object
          required: [feeId, feeType, period, faculty, department, level, includeInactive, departments]
          properties:
            feeId: { type: [string, 'null'] }
            feeType: { type: [string, 'null'] }
            period: { type: [string, 'null'] }
            faculty: { type: [string, 'null'] }
            department: { type: [string, 'null'] }
            level: { type: [integer, 'null'] }
            includeInactive: { type: boolean }
            departments: { type: [array, 'null'], items: { type: string }, description: "A head of department's or dean's departments; null = all" }
        totals: { $ref: '#/components/schemas/OutstandingTotals' }
        grid:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/OutstandingTotals'
              - type: object
                required: [department, departmentName, facultyCode, facultyName, level]
                properties:
                  department: { type: [string, 'null'] }
                  departmentName: { type: [string, 'null'] }
                  facultyCode: { type: [string, 'null'] }
                  facultyName: { type: [string, 'null'] }
                  level: { type: [integer, 'null'] }
        byFee:
          type: array
          items:
            type: object
            required: [feeId, feeName, period, feeTypeCode, dueDate, obligations, billed, collected, outstanding, collectionRate]
            properties:
              feeId: { type: string, format: uuid }
              feeName: { type: string }
              period: { type: string }
              feeTypeCode: { type: string }
              dueDate: { type: [string, 'null'], format: date-time }
              obligations: { type: integer }
              billed: { type: string, description: 'SLE minor units' }
              collected: { type: string, description: 'SLE minor units' }
              outstanding: { type: string, description: 'SLE minor units' }
              collectionRate: { type: [number, 'null'] }
        applicants:
          type: object
          required: [byStatus]
          properties:
            byStatus:
              type: array
              items:
                type: object
                required: [status, applicants, billed, collected, outstanding, paid]
                properties:
                  status: { type: [string, 'null'] }
                  applicants: { type: integer }
                  billed: { type: string, description: 'SLE minor units' }
                  collected: { type: string, description: 'SLE minor units' }
                  outstanding: { type: string, description: 'SLE minor units' }
                  paid: { type: integer }
        roster:
          type: object
          required: [activeStudents, withoutObligations, lastPortalEventAt]
          properties:
            activeStudents: { type: integer }
            withoutObligations: { type: integer, description: 'Active students with no obligation at all (usually a missing rate rule)' }
            lastPortalEventAt: { type: [string, 'null'], format: date-time }
    PayerListItem:
      type: object
      required: [id, kind, ref, fullName, maskedPhone, maskedEmail, programCode, department, departmentName, facultyCode, level, enrolmentStatus, applicantStatus, obligations, billed, collected, balance, standing, overdue, overdueAmount, lastPaymentAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [STUDENT, APPLICANT] }
        ref: { type: string }
        fullName: { type: string }
        maskedPhone: { type: string, example: '+232*****456' }
        maskedEmail: { type: [string, 'null'], example: 'a***@gmail.com' }
        programCode: { type: string }
        department: { type: [string, 'null'] }
        departmentName: { type: [string, 'null'] }
        facultyCode: { type: [string, 'null'] }
        level: { type: [integer, 'null'] }
        enrolmentStatus: { type: [string, 'null'], enum: [ACTIVE, SUSPENDED, WITHDRAWN, GRADUATED, null] }
        applicantStatus: { type: [string, 'null'] }
        obligations: { type: integer, description: Obligations counted (of the selected fees) }
        billed: { type: string, description: 'SLE minor units' }
        collected: { type: string, description: 'SLE minor units' }
        balance: { type: string, description: 'Outstanding, SLE minor units' }
        standing: { $ref: '#/components/schemas/Standing' }
        overdue: { type: boolean }
        overdueAmount: { type: string, description: 'SLE minor units' }
        lastPaymentAt: { type: [string, 'null'], format: date-time }
    PayerDetail:
      type: object
      required: [payer, linked, totals, obligations, receipts, portalEvents]
      properties:
        payer:
          type: object
          required: [id, kind, ref, fullName, phone, email, programCode, department, departmentName, facultyCode, facultyName, level, finalYear, residency, intake, applicantStatus, enrolmentStatus, applicationRef, portalUpdatedAt, snapshotAt]
          properties:
            id: { type: string, format: uuid }
            kind: { type: string, enum: [STUDENT, APPLICANT] }
            ref: { type: string }
            fullName: { type: string }
            phone: { type: string, description: Full number }
            email: { type: [string, 'null'], description: 'Full email, when the portal has one' }
            programCode: { type: string }
            department: { type: [string, 'null'] }
            departmentName: { type: [string, 'null'] }
            facultyCode: { type: [string, 'null'] }
            facultyName: { type: [string, 'null'] }
            level: { type: [integer, 'null'] }
            finalYear: { type: [boolean, 'null'] }
            residency: { type: string, enum: [LOCAL, INTERNATIONAL] }
            intake: { type: string }
            applicantStatus: { type: [string, 'null'] }
            enrolmentStatus: { type: [string, 'null'], enum: [ACTIVE, SUSPENDED, WITHDRAWN, GRADUATED, null] }
            applicationRef: { type: [string, 'null'] }
            portalUpdatedAt: { type: [string, 'null'], format: date-time }
            snapshotAt: { type: string, format: date-time }
        linked:
          type: object
          required: [applicant, student]
          description: The application a student came from, or the student an applicant became.
          properties:
            applicant: { type: [object, 'null'], required: [id, ref], properties: { id: { type: string, format: uuid }, ref: { type: string } } }
            student: { type: [object, 'null'], required: [id, ref], properties: { id: { type: string, format: uuid }, ref: { type: string } } }
        totals:
          type: object
          required: [obligations, billed, collected, outstanding, standing, overdue, collectionRate]
          properties:
            obligations: { type: integer }
            billed: { type: string, description: 'SLE minor units' }
            collected: { type: string, description: 'SLE minor units' }
            outstanding: { type: string, description: 'SLE minor units' }
            standing: { $ref: '#/components/schemas/Standing' }
            overdue: { type: boolean }
            collectionRate: { type: [number, 'null'] }
        obligations:
          type: array
          items:
            type: object
            required: [id, status, amount, rateRuleId, createdAt, fee, billed, collected, balance, overdue, minInstalment, entries, payments]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [OPEN, PAID] }
              amount: { type: string, description: 'SLE minor units, as priced' }
              rateRuleId: { type: [string, 'null'], format: uuid }
              createdAt: { type: string, format: date-time }
              fee:
                type: object
                required: [id, name, period, feeTypeCode, status, dueDate]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  period: { type: string }
                  feeTypeCode: { type: string }
                  status: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
                  dueDate: { type: [string, 'null'], format: date-time }
              billed: { type: string, description: 'SLE minor units' }
              collected: { type: string, description: 'SLE minor units' }
              balance: { type: string, description: 'SLE minor units (negative = overpaid)' }
              overdue: { type: boolean }
              minInstalment: { type: string, description: 'Smallest next payment the channels accept against the balance, SLE minor units' }
              entries:
                type: array
                items:
                  type: object
                  required: [id, type, amount, memo, paymentId, createdBy, createdAt]
                  properties:
                    id: { type: string, format: uuid }
                    type: { type: string, enum: [CHARGE, PAYMENT, ADJUSTMENT, REFUND] }
                    amount: { type: string, description: 'Signed, SLE minor units' }
                    memo: { type: [string, 'null'] }
                    paymentId: { type: [string, 'null'], format: uuid }
                    createdBy: { type: string }
                    createdAt: { type: string, format: date-time }
              payments:
                type: array
                items:
                  type: object
                  required: [id, paymentRef, amount, status, channel, collectionMethod, payerPhone, createdAt, completedAt, failureReason, receiptNumber]
                  properties:
                    id: { type: string, format: uuid }
                    paymentRef: { type: string }
                    amount: { type: string, description: 'SLE minor units' }
                    status: { $ref: '#/components/schemas/PaymentStatus' }
                    channel: { $ref: '#/components/schemas/Channel' }
                    collectionMethod: { type: string }
                    payerPhone: { type: [string, 'null'] }
                    createdAt: { type: string, format: date-time }
                    completedAt: { type: [string, 'null'], format: date-time }
                    failureReason: { type: [string, 'null'] }
                    receiptNumber: { type: [string, 'null'] }
        receipts:
          type: array
          items:
            type: object
            required: [id, number, amount, issuedAt, obligationId, paymentId]
            properties:
              id: { type: string, format: uuid }
              number: { type: string }
              amount: { type: string, description: 'SLE minor units' }
              issuedAt: { type: string, format: date-time }
              obligationId: { type: string, format: uuid }
              paymentId: { type: string, format: uuid }
        portalEvents:
          type: array
          items:
            type: object
            required: [id, type, result, error, occurredAt, receivedAt]
            properties:
              id: { type: string }
              type: { type: string }
              result: { type: string, enum: [APPLIED, STALE, REJECTED] }
              error: { type: [string, 'null'] }
              occurredAt: { type: [string, 'null'], format: date-time }
              receivedAt: { type: string, format: date-time }
    Permission:
      type: string
      enum: [fees.read, fees.manage, instalments.manage, payers.read, payers.adjust, payments.read, payments.export, payments.refund, payments.reconcile, receipts.resend, accounts.read, accounts.manage, payouts.read, payouts.manage, transfers.read, transfers.retry, reconciliation.read, reconciliation.manage, outbox.read, outbox.retry, reports.read, audit.read, users.manage, settings.manage, academics.manage, portal.read, clearance.manage]

    CountAmount:
      type: object
      properties:
        count: { type: integer }
        amount: { type: string, description: 'SLE minor units' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: OBLIGATION_SETTLED }
            message: { type: string }
            details: { type: [object, 'null'], additionalProperties: true }
    ValidationError:
      type: object
      properties:
        statusCode: { type: integer, example: 400 }
        message: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        error: { type: string, example: Bad Request }

    Payer:
      type: object
      properties:
        kind: { type: string, enum: [applicant, student] }
        ref: { type: string, example: UNI-2025-0002 }
        maskedName: { type: string, example: M*** J*** }
        programLine: { type: string, example: BSC-CS · Level 2 }
        stale: { type: boolean, description: 'true: the portal was unreachable; cached data was used.' }
    Obligation:
      type: object
      properties:
        id: { type: string, format: uuid }
        feeTypeCode: { type: string, example: TUITION }
        feeName: { type: string }
        period: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        paid: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        holds: { $ref: '#/components/schemas/Money', description: 'Open payments not yet expired.' }
        payable: { $ref: '#/components/schemas/Money', description: 'balance − holds' }
        minInstalment: { $ref: '#/components/schemas/Money' }
        allowInstalments: { type: boolean }
        dueDate: { type: [string, 'null'], format: date }
        status: { type: string, enum: [OPEN, PAID] }
    ChannelPayment:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        paymentRef: { $ref: '#/components/schemas/PaymentRef' }
        monimeOrderNumber: { type: [string, 'null'], example: 3BMRXXXQXJW3 }
        obligationId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus', description: 'Open payments past expiry read EXPIRED.' }
        amount: { $ref: '#/components/schemas/Money' }
        channel: { $ref: '#/components/schemas/Channel' }
        expiresAt: { type: string, format: date-time }
        ussdCode: { type: [string, 'null'], description: 'Only while PENDING.' }
        completedAt: { type: [string, 'null'], format: date-time }
        failureReason: { type: [string, 'null'] }
    PaymentStatusView:
      type: object
      properties:
        paymentRef: { $ref: '#/components/schemas/PaymentRef' }
        monimeOrderNumber: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        feeName: { type: string }
        payer:
          type: object
          properties:
            kind: { type: string, enum: [applicant, student] }
            ref: { type: string }
            maskedName: { type: string }
        receiptNumber: { type: [string, 'null'], example: UNIMAK-2026-000001 }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    Receipt:
      type: object
      properties:
        number: { type: string, example: UNIMAK-2026-000001 }
        amount: { $ref: '#/components/schemas/Money' }
        feeName: { type: string }
        period: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        issuedAt: { type: string, format: date-time }
        paymentId: { type: string, format: uuid }

    Matchers:
      type: object
      description: Omitted or null = matches any.
      properties:
        programCode: { type: [string, 'null'], maxLength: 20, example: BSC-CS, description: 'As the portal sends it; not checked.' }
        department: { type: [string, 'null'], maxLength: 50, example: COMPUTER-SCI, description: 'Must be an active, reviewed department (400 otherwise).' }
        level: { type: [integer, 'null'], minimum: 1, maximum: 10 }
        residency: { type: [string, 'null'], enum: [LOCAL, INTERNATIONAL, null] }
        intake: { type: [string, 'null'], pattern: '^[A-Za-z0-9-]{4,20}$', example: 2026-SEP }

    # ── Admin response shapes built on the generated rows ──
    AdminPrincipal:
      type: object
      required: [id, email, role, permissions, departments, faculties, departmentScoped, aal]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AdminRole' }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        departments: { type: array, items: { type: string }, description: 'Department codes the admin is limited to. For a dean: every department of their faculties, as they are now.' }
        faculties: { type: array, items: { type: string }, description: 'DEAN: their faculty codes. Empty otherwise.' }
        departmentScoped: { type: boolean, description: 'true for HEAD_OF_DEPARTMENT and DEAN: payments and reports are limited to `departments`.' }
        aal: { type: string, enum: [aal1, aal2], description: Supabase authenticator assurance level }
    AcademicCode:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$'
      example: NURSING
      description: Never changes. Department codes must match exactly what the portal sends.
    FacultyWithDepartments:
      allOf:
        - $ref: '#/components/schemas/Faculty'
        - type: object
          required: [departments]
          properties:
            departments: { type: array, items: { $ref: '#/components/schemas/Department' } }
    DepartmentListItem:
      allOf:
        - $ref: '#/components/schemas/Department'
        - type: object
          required: [facultyCode, facultyName]
          properties:
            facultyCode: { type: [string, 'null'] }
            facultyName: { type: [string, 'null'] }
    InviteOutcome:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [SENT, ALREADY_REGISTERED, NOT_CONFIGURED, FAILED]
          description: |
            SENT: Supabase emailed the invite link. ALREADY_REGISTERED: the email already has a sign-in, they just sign in.
            NOT_CONFIGURED: no service role key on the backend, nothing sent. FAILED: Supabase refused (e.g. email rate limit) — re-send.
        message: { type: string, description: 'Why, for anything but SENT.' }
    InvitedAdminUser:
      description: The admin user and what happened to the invite email.
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          required: [invitation]
          properties:
            invitation: { $ref: '#/components/schemas/InviteOutcome' }
    AdminPayment:
      description: A payment row with its fee and payer.
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required: [feeTypeCode, feeName, payer, receiptNumber]
          properties:
            feeTypeCode: { type: string }
            feeName: { type: string }
            payer:
              type: object
              required: [kind, ref, fullName, programCode, department, departmentName, facultyCode, facultyName]
              properties:
                kind: { $ref: '#/components/schemas/PayerKind' }
                ref: { type: string }
                fullName: { type: string }
                programCode: { type: string }
                department: { type: [string, 'null'], description: Department code the portal sent }
                departmentName: { type: [string, 'null'] }
                facultyCode: { type: [string, 'null'], description: The department's current faculty }
                facultyName: { type: [string, 'null'] }
            receiptNumber: { type: [string, 'null'] }
    AdminPaymentDetail:
      allOf:
        - $ref: '#/components/schemas/AdminPayment'
        - type: object
          required: [ledgerEntry, commissionTransfer]
          properties:
            ledgerEntry: { oneOf: [{ $ref: '#/components/schemas/LedgerEntry' }, { type: 'null' }], description: 'The PAYMENT ledger entry, once completed.' }
            commissionTransfer: { oneOf: [{ $ref: '#/components/schemas/Transfer' }, { type: 'null' }] }
    AccountListItem:
      allOf:
        - $ref: '#/components/schemas/FinancialAccount'
        - type: object
          required: [feeTypeCode, unsubmittedPayouts]
          properties:
            feeTypeCode: { type: [string, 'null'] }
            unsubmittedPayouts: { type: string, description: 'SLE minor units in REQUESTED payouts not yet accepted by Monime.' }
    ProvisionedAccount:
      type: object
      required: [reference, monimeId, name, purpose, feeTypeCode, created]
      properties:
        reference: { type: string, example: unimak-fee-tuition }
        monimeId: { type: string }
        name: { type: string }
        purpose: { $ref: '#/components/schemas/FinancialAccountPurpose' }
        feeTypeCode: { type: [string, 'null'] }
        created: { type: boolean, description: 'false: it already existed (here, or at Monime and was linked).' }
    Bank:
      type: object
      required: [providerId, name, active, canPayTo]
      properties:
        providerId: { type: string, example: slb001 }
        name: { type: string }
        active: { type: boolean }
        canPayTo: { type: boolean, description: 'Payouts can be sent to this bank.' }
    PayoutListItem:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          required: [financialAccount]
          properties:
            financialAccount:
              type: object
              required: [reference, monimeId]
              properties: { reference: { type: string }, monimeId: { type: string } }
    PayoutDetail:
      allOf:
        - $ref: '#/components/schemas/Payout'
        - type: object
          required: [financialAccount]
          properties:
            financialAccount: { $ref: '#/components/schemas/FinancialAccount' }
    ReconciliationRunDetail:
      allOf:
        - $ref: '#/components/schemas/ReconciliationRun'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } }
    ReconciliationSummary:
      type: object
      required: [lastRun, counts, listLimit, openItems, webhookEvents, failedTransfers, stuckTransfers, stuckPayouts, failedPayouts, deadOutbox, staleOpenPayments]
      properties:
        lastRun: { oneOf: [{ $ref: '#/components/schemas/ReconciliationRun' }, { type: 'null' }] }
        counts:
          type: object
          description: Exact counts (the lists below hold at most `listLimit` each).
          required: [openItems, webhookEvents, failedTransfers, stuckTransfers, stuckPayouts, failedPayouts, deadOutbox, staleOpenPayments]
          properties:
            openItems: { type: integer, description: OPEN reconciliation items }
            webhookEvents: { type: integer, description: UNMATCHED or FAILED webhook events nobody resolved }
            failedTransfers: { type: [integer, 'null'], description: 'null without transfers.read' }
            stuckTransfers: { type: [integer, 'null'], description: 'PENDING/SUBMITTED for over an hour; null without transfers.read' }
            stuckPayouts: { type: integer, description: REQUESTED/SUBMITTED/PROCESSING for over an hour }
            failedPayouts: { type: integer, description: FAILED in the last 7 days }
            deadOutbox: { type: integer }
            staleOpenPayments: { type: integer, description: 'Open past expiry (the expiry job clears these within 5 minutes).' }
        listLimit: { type: integer, example: 100 }
        openItems: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } }
        webhookEvents: { type: array, items: { $ref: '#/components/schemas/WebhookEventSummary' } }
        failedTransfers: { type: [array, 'null'], items: { $ref: '#/components/schemas/Transfer' }, description: 'null without transfers.read' }
        stuckTransfers: { type: [array, 'null'], items: { $ref: '#/components/schemas/Transfer' }, description: 'null without transfers.read' }
        stuckPayouts: { type: array, items: { $ref: '#/components/schemas/Payout' } }
        failedPayouts: { type: array, items: { $ref: '#/components/schemas/Payout' } }
        deadOutbox: { type: array, items: { $ref: '#/components/schemas/OutboxMessage' } }
        staleOpenPayments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    WebhookAck:
      type: object
      required: [received, eventId, result]
      properties:
        received: { const: true }
        eventId: { type: string }
        result: { type: string, enum: [PROCESSED, IGNORED, UNMATCHED, DUPLICATE] }
        note: { type: string, description: 'Why it was UNMATCHED / flagged (e.g. amount mismatch, late settlement).' }
    FeeTypeListItem:
      allOf:
        - $ref: '#/components/schemas/FeeType'
        - type: object
          required: [account, _count]
          properties:
            account: { oneOf: [{ $ref: '#/components/schemas/FinancialAccount' }, { type: 'null' }] }
            _count: { type: object, required: [fees], properties: { fees: { type: integer } } }
    FeeTypeWithAccount:
      allOf:
        - $ref: '#/components/schemas/FeeType'
        - type: object
          required: [account]
          properties:
            account: { oneOf: [{ $ref: '#/components/schemas/FinancialAccount' }, { type: 'null' }] }
    FeeListItem:
      allOf:
        - $ref: '#/components/schemas/Fee'
        - type: object
          required: [feeType, _count]
          properties:
            feeType: { $ref: '#/components/schemas/FeeType' }
            _count: { type: object, required: [obligations, rateRules], properties: { obligations: { type: integer }, rateRules: { type: integer } } }
    FeeDetail:
      allOf:
        - $ref: '#/components/schemas/Fee'
        - type: object
          required: [feeType, rateRules, eligibilityRules, instalmentRules, _count]
          properties:
            feeType: { $ref: '#/components/schemas/FeeTypeWithAccount' }
            rateRules: { type: array, items: { $ref: '#/components/schemas/RateRule' } }
            eligibilityRules: { type: array, items: { $ref: '#/components/schemas/EligibilityRule' } }
            instalmentRules: { type: array, items: { $ref: '#/components/schemas/InstalmentRule' } }
            _count: { type: object, required: [obligations], properties: { obligations: { type: integer } } }
    FeePreview:
      type: object
